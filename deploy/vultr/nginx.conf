# Replace app.yourdomain.com with the actual hostname before installing.
server {
    listen 80;
    server_name app.yourdomain.com;
    root /srv/commonplace/current/apps/web/dist;
    index index.html;
    client_max_body_size 9m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Retain hashed assets across releases for tabs opened before an update.
    location ^~ /assets/ {
        root /srv/commonplace;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
