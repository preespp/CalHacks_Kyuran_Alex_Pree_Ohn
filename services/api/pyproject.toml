[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "commonplace-api"
version = "0.1.0"
description = "Evidence-backed shared object memory for the Commonplace hackathon MVP"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
spatial = ["torch>=2.6,<3", "torchvision>=0.21,<1", "transformers>=4.48,<5"]

[tool.hatch.build.targets.wheel]
packages = ["commonplace_api"]

[tool.hatch.build.targets.wheel.force-include]
"../../camera_capture/__init__.py" = "camera_capture/__init__.py"
"../../camera_capture/image_quality.py" = "camera_capture/image_quality.py"
"../../camera_capture/spacetime_wire.py" = "camera_capture/spacetime_wire.py"
"../worker" = "services/worker"

[tool.pytest.ini_options]
testpaths = ["tests"]
